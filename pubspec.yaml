name: nip
description: "NIP - ProxiUPI: Secure Offline Proximity Payment Mesh"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0-95.1.beta

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Local Database
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28

  # Secure Storage
  flutter_secure_storage: ^9.2.4

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  path_provider: ^2.1.5
  google_fonts: ^6.2.1
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3

flutter:
  uses-material-design: true
